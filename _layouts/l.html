---
layout: base
---

<script type="text/javascript">
 lexemeSparql = `
# Data for a specific lexeme
SELECT DISTINCT
  ?description
  (GROUP_CONCAT(DISTINCT ?value_Url_flat; separator=" // ") AS ?value_Url)
  (GROUP_CONCAT(DISTINCT COALESCE(?valueLabel_flat, ?valuelabel_lemma); separator=" <br/>// ") AS ?valueLabel)
  (SAMPLE(IF(BOUND(?valueLabel_flat) || BOUND(?valuelabel_lemma), COALESCE(?valueLabel_flat, ?valuelabel_lemma), ?valueLabel_direct)) AS ?value_)
  (GROUP_CONCAT(DISTINCT ?source_flat; separator=" <br/> ") AS ?source)
  (GROUP_CONCAT(DISTINCT ?sourceUrl_flat; separator=" <br/> ") AS ?sourceUrl)
  (GROUP_CONCAT(DISTINCT ?sourcelink_flat; separator=" // ") AS ?sourceLink)
WHERE {
  VALUES ?lexeme { wd:${ l } }
  
  {
    BIND(1 AS ?order)
    BIND("Lemma" AS ?description)
    wd:${ l } wikibase:lemma ?valuelabel_lemma . 
  }
  UNION 
  {
    BIND(2 AS ?order)
    BIND("Language" AS ?description)
    wd:${ l } dct:language ?value_lang .
    ?value_lang rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = 'en')
    BIND(CONCAT("../language?q=", SUBSTR(STR(?value_lang), 32),"&qLabel=",?valueLabel_direct,"&displaylang=en") AS ?value_Url_flat)
  }
  UNION 
  {
    BIND(3 AS ?order)
    BIND("Dialect" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Dialect" AS ?description)
        wd:${ l } p:P7481 ?value_statement_dial .
        ?value_statement_dial ps:P7481 ?valueurl_dial .
        ?valueurl_dial rdfs:label ?valuelab_dial .
        FILTER (LANG(?valuelab_dial) = 'en')
        
        BIND(IF(BOUND(?langLabel) && ?langLabel != "", CONCAT(?valuelab_dial, " (", ?langLabel, ")"), ?valuelab_dial) AS ?valueLabel_flat)
        BIND(?valueurl_dial AS ?value_Url_flat)
        
        OPTIONAL {	  
          ?value_statement_dial prov:wasDerivedFrom ?deriv_dial .
          ?deriv_dial pr:P248 ?source_dial . 
          OPTIONAL { ?source_dial p:P724 ?inetarchive_stat_dial . ?inetarchive_stat_dial ps:P724 ?inetarchive_dial . OPTIONAL{?inetarchive_stat_dial pq:P8330 ?offset_dial .} OPTIONAL{?inetarchive_stat_dial pq:P478 ?inettvol_dial . }}
          OPTIONAL { ?deriv_dial pr:P478 ?refvol_dial . }
          OPTIONAL { ?deriv_dial pr:P1810 ?valuenum_dial . }
          OPTIONAL { ?deriv_dial pr:P7421 ?refline_dial . }
          OPTIONAL { ?deriv_dial pr:P304 ?refpage_dial . }
          OPTIONAL { ?deriv_dial pq:P3903 ?refcol_dial . }
          BIND(COALESCE(?inettvol_dial, "") AS ?inetvol_dial)
          BIND(COALESCE(?refvol_dial, "") AS ?refvoll_dial)
          BIND(COALESCE(CONCAT(?valuenum_dial, " "), "") AS ?thenum_dial)
          BIND(COALESCE(CONCAT("v. ", ?refvol_dial, " "), "") AS ?thevol_dial)
          BIND(COALESCE(CONCAT("p. ",?refpage_dial,""), "") AS ?thepage_dial)
          BIND(COALESCE(CONCAT(" c. ",?refcol_dial,""), "") AS ?thecol_dial)
          BIND(COALESCE(CONCAT(" l. ",?refline_dial), "") AS ?theline_dial)
          BIND(CONCAT(?thenum_dial, ?thevol_dial, ?thepage_dial, ?thecol_dial, ?theline_dial) AS ?refnumber_dial)
          BIND(IF(BOUND(?offset_dial), COALESCE(xsd:integer(?refpage_dial)+xsd:integer(?offset_dial),?refpage_dial), ?refpage_dial) AS ?realpage_dial)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_dial,COALESCE(CONCAT("/page/n",STR(?realpage_dial),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_dial rdfs:label ?titlee_dial .
          FILTER(?inetvol_dial = ?refvoll_dial)
          FILTER (LANG(?titlee_dial) = 'en')
          BIND(CONCAT(?titlee_dial," [",?refnumber_dial,"]") AS ?title_dial)    
          BIND(COALESCE(?title_dial, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_dial),""),"&highlight=",STR(?refnumber_dial),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_dial), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(4 AS ?order)
    BIND("Lexical category" AS ?description)
    wd:${ l } wikibase:lexicalCategory ?value_lex .
    wd:${ l } dct:language ?langvalue_lex .
    ?langvalue_lex rdfs:label ?langvalueLabel_lex .
    FILTER (LANG(?langvalueLabel_lex) = 'en')
    ?value_lex rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = 'en')
    BIND(CONCAT("../lexical-category?q=",?value_lex,"&qLabel=",?valueLabel_direct,"&l=",?langvalue_lex,"&lLabel=",?langvalueLabel_lex,"&displaylang=en") AS ?value_Url_flat)
  }
  UNION 
  {
    BIND(5 AS ?order)
    BIND("Instance of" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Instance of" AS ?description)
        wd:${ l } p:P31 ?value_statement_inst .
        ?value_statement_inst ps:P31 ?valueurl_inst .
        ?valueurl_inst rdfs:label ?valuelab_inst .
        FILTER (LANG(?valuelab_inst) = 'en')
        
        BIND(IF(BOUND(?langLabel) && ?langLabel != "", CONCAT(?valuelab_inst, " (", ?langLabel, ")"), ?valuelab_inst) AS ?valueLabel_flat)
        BIND(?valueurl_inst AS ?value_Url_flat)
        
        OPTIONAL {	  
          ?value_statement_inst prov:wasDerivedFrom ?deriv_inst .
          ?deriv_inst pr:P248 ?source_inst . 
          OPTIONAL { ?source_inst p:P724 ?inetarchive_stat_inst . ?inetarchive_stat_inst ps:P724 ?inetarchive_inst . OPTIONAL{?inetarchive_stat_inst pq:P8330 ?offset_inst .} OPTIONAL{?inetarchive_stat_inst pq:P478 ?inettvol_inst . }}
          OPTIONAL { ?deriv_inst pr:P478 ?refvol_inst . }
          OPTIONAL { ?deriv_inst pr:P1810 ?valuenum_inst . }
          OPTIONAL { ?deriv_inst pr:P7421 ?refline_inst . }
          OPTIONAL { ?deriv_inst pr:P304 ?refpage_inst . }
          OPTIONAL { ?deriv_inst pq:P3903 ?refcol_inst . }
          BIND(COALESCE(?inettvol_inst, "") AS ?inetvol_inst)
          BIND(COALESCE(?refvol_inst, "") AS ?refvoll_inst)
          BIND(COALESCE(CONCAT(?valuenum_inst, " "), "") AS ?thenum_inst)
          BIND(COALESCE(CONCAT("v. ", ?refvol_inst, " "), "") AS ?thevol_inst)
          BIND(COALESCE(CONCAT("p. ",?refpage_inst,""), "") AS ?thepage_inst)
          BIND(COALESCE(CONCAT(" c. ",?refcol_inst,""), "") AS ?thecol_inst)
          BIND(COALESCE(CONCAT(" l. ",?refline_inst), "") AS ?theline_inst)
          BIND(CONCAT(?thenum_inst, ?thevol_inst, ?thepage_inst, ?thecol_inst, ?theline_inst) AS ?refnumber_inst)
          BIND(IF(BOUND(?offset_inst), COALESCE(xsd:integer(?refpage_inst)+xsd:integer(?offset_inst),?refpage_inst), ?refpage_inst) AS ?realpage_inst)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_inst,COALESCE(CONCAT("/page/n",STR(?realpage_inst),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_inst rdfs:label ?titlee_inst .
          FILTER(?inetvol_inst = ?refvoll_inst)
          FILTER (LANG(?titlee_inst) = 'en')
          BIND(CONCAT(?titlee_inst," [",?refnumber_inst,"]") AS ?title_inst)    
          BIND(COALESCE(?title_inst, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_inst),""),"&highlight=",STR(?refnumber_inst),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_inst), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(6 AS ?order)
    BIND("Word stem" AS ?description)
    wd:${ l } wdt:P5187 ?valueLabel_direct .
  }
  UNION 
  {
    BIND(7 AS ?order)
    BIND("Based on" AS ?description)
    wd:${ l } wdt:P144 ?valueLabel_direct .
  }
  UNION 
  {
    BIND(8 AS ?order)
    BIND("Paradigm" AS ?description)
    wd:${ l } wdt:P5911 ?value_Url_flat .
    ?value_Url_flat rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = 'en')
  }
  UNION 
  {
    BIND(9 AS ?order)
    BIND("Root" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Root" AS ?description)
        wd:${ l } p:P5920 ?value_statement_root .
        ?value_statement_root ps:P5920 ?value_root .
        OPTIONAL { ?value_statement_root pq:P5980 / skos:definition ?objsense_root . FILTER(LANG(?objsense_root)="en") }
        ?value_root wikibase:lemma ?valuelab_root .
        
        BIND(CONCAT(?valuelab_root, COALESCE(CONCAT(" [", ?objsense_root, "]"), "")) AS ?valueLabel_flat)
        BIND(CONCAT("../l?qLabel=", ?valueLabel_flat, "&displaylang=en&l=", SUBSTR(STR(?value_root), 32)) AS ?value_Url_flat)
        
        OPTIONAL {	  
          wd:${ l } dct:language ?language_root .
          BIND(SUBSTR(STR(?language_root), 32) AS ?lang_root)
          ?value_statement_root prov:wasDerivedFrom ?deriv_root .
          ?deriv_root pr:P248 ?source_root . 
          OPTIONAL { ?source_root p:P724 ?inetarchive_stat_root . ?inetarchive_stat_root ps:P724 ?inetarchive_root . OPTIONAL{?inetarchive_stat_root pq:P8330 ?offset_root .} OPTIONAL{?inetarchive_stat_root pq:P478 ?inettvol_root . }}
          OPTIONAL { ?deriv_root pr:P478 ?refvol_root . }
          OPTIONAL { ?deriv_root pr:P1810 ?valuenum_root . }
          OPTIONAL { ?deriv_root pr:P7421 ?refline_root . }
          OPTIONAL { ?deriv_root pr:P304 ?refpage_root . }
          OPTIONAL { ?deriv_root pq:P3903 ?refcol_root . }
          BIND(COALESCE(?inettvol_root, "") AS ?inetvol_root)
          BIND(COALESCE(?refvol_root, "") AS ?refvoll_root)
          BIND(COALESCE(CONCAT(?valuenum_root, " "), "") AS ?thenum_root)
          BIND(COALESCE(CONCAT("v. ", ?refvol_root, " "), "") AS ?thevol_root)
          BIND(COALESCE(CONCAT("p. ",?refpage_root,""), "") AS ?thepage_root)
          BIND(COALESCE(CONCAT(" c. ",?refcol_root,""), "") AS ?thecol_root)
          BIND(COALESCE(CONCAT(" l. ",?refline_root), "") AS ?theline_root)
          BIND(CONCAT(?thenum_root, ?thevol_root, ?thepage_root, ?thecol_root, ?theline_root) AS ?refnumber_root)
          BIND(IF(BOUND(?offset_root), COALESCE(xsd:integer(?refpage_root)+xsd:integer(?offset_root),?refpage_root), ?refpage_root) AS ?realpage_root)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_root,COALESCE(CONCAT("/page/n",STR(?realpage_root),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_root rdfs:label ?titlee_root .
          FILTER(?inetvol_root = ?refvoll_root)
          FILTER (LANG(?titlee_root) = 'en')
          BIND(CONCAT(?titlee_root," [",?refnumber_root,"]") AS ?title_root)    
          BIND(COALESCE(?title_root, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=",COALESCE(?lang_root,""),"&qLabel=",COALESCE(STR(?title_root),""),"&highlight=",STR(?refnumber_root),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_root), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(10 AS ?order)
    BIND("Grammatical gender" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Grammatical gender" AS ?description)
        wd:${ l } p:P5185 ?value_statement_gender .
        ?value_statement_gender ps:P5185 ?valueurl_gender .
        ?valueurl_gender rdfs:label ?valuelab_gender .
        FILTER (LANG(?valuelab_gender) = 'en')
        
        BIND(IF(BOUND(?langLabel) && ?langLabel != "", CONCAT(?valuelab_gender, " (", ?langLabel, ")"), ?valuelab_gender) AS ?valueLabel_flat)
        BIND(?valueurl_gender AS ?value_Url_flat)
        
        OPTIONAL {	  
          ?value_statement_gender prov:wasDerivedFrom ?deriv_gender .
          ?deriv_gender pr:P248 ?source_gender . 
          OPTIONAL { ?source_gender p:P724 ?inetarchive_stat_gender . ?inetarchive_stat_gender ps:P724 ?inetarchive_gender . OPTIONAL{?inetarchive_stat_gender pq:P8330 ?offset_gender .} OPTIONAL{?inetarchive_stat_gender pq:P478 ?inettvol_gender . }}
          OPTIONAL { ?deriv_gender pr:P478 ?refvol_gender . }
          OPTIONAL { ?deriv_gender pr:P1810 ?valuenum_gender . }
          OPTIONAL { ?deriv_gender pr:P7421 ?refline_gender . }
          OPTIONAL { ?deriv_gender pr:P304 ?refpage_gender . }
          OPTIONAL { ?deriv_gender pq:P3903 ?refcol_gender . }
          BIND(COALESCE(?inettvol_gender, "") AS ?inetvol_gender)
          BIND(COALESCE(?refvol_gender, "") AS ?refvoll_gender)
          BIND(COALESCE(CONCAT(?valuenum_gender, " "), "") AS ?thenum_gender)
          BIND(COALESCE(CONCAT("v. ", ?refvol_gender, " "), "") AS ?thevol_gender)
          BIND(COALESCE(CONCAT("p. ",?refpage_gender,""), "") AS ?thepage_gender)
          BIND(COALESCE(CONCAT(" c. ",?refcol_gender,""), "") AS ?thecol_gender)
          BIND(COALESCE(CONCAT(" l. ",?refline_gender), "") AS ?theline_gender)
          BIND(CONCAT(?thenum_gender, ?thevol_gender, ?thepage_gender, ?thecol_gender, ?theline_gender) AS ?refnumber_gender)
          BIND(IF(BOUND(?offset_gender), COALESCE(xsd:integer(?refpage_gender)+xsd:integer(?offset_gender),?refpage_gender), ?refpage_gender) AS ?realpage_gender)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_gender,COALESCE(CONCAT("/page/n",STR(?realpage_gender),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_gender rdfs:label ?titlee_gender .
          FILTER(?inetvol_gender = ?refvoll_gender)
          FILTER (LANG(?titlee_gender) = 'en')
          BIND(CONCAT(?titlee_gender," [",?refnumber_gender,"]") AS ?title_gender)    
          BIND(COALESCE(?title_gender, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_gender),""),"&highlight=",STR(?refnumber_gender),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_gender), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(11 AS ?order)
    BIND("Conjugation class" AS ?description)
    wd:${ l } wdt:P5186 ?value_conj .
    ?value_conj rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = "en")
    BIND(CONCAT("../property_value?p=P5186&q=", SUBSTR(STR(?value_conj), 32),"&qLabel=",?valueLabel_direct) AS ?value_Url_flat)
  }
  UNION 
  {
    BIND(12 AS ?order)
    BIND("Auxiliary verb" AS ?description)
    wd:${ l } wdt:P5401 ?value_aux .
    ?value_aux wikibase:lemma ?valuelabel_lemma .
    BIND(SUBSTR(STR(?value_aux), 32) AS ?value_Url_flat)
  }
  UNION 
  {
    BIND(13 AS ?order)
    BIND("Characterized by" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Characterized by" AS ?description)
        wd:${ l } p:P1552 ?value_statement_char .
        ?value_statement_char ps:P1552 ?valueurl_char .
        ?valueurl_char rdfs:label ?valuelab_char .
        FILTER (LANG(?valuelab_char) = 'en')
        
        BIND(IF(BOUND(?langLabel) && ?langLabel != "", CONCAT(?valuelab_char, " (", ?langLabel, ")"), ?valuelab_char) AS ?valueLabel_flat)
        BIND(?valueurl_char AS ?value_Url_flat)
        
        OPTIONAL {	  
          ?value_statement_char prov:wasDerivedFrom ?deriv_char .
          ?deriv_char pr:P248 ?source_char . 
          OPTIONAL { ?source_char p:P724 ?inetarchive_stat_char . ?inetarchive_stat_char ps:P724 ?inetarchive_char . OPTIONAL{?inetarchive_stat_char pq:P8330 ?offset_char .} OPTIONAL{?inetarchive_stat_char pq:P478 ?inettvol_char . }}
          OPTIONAL { ?deriv_char pr:P478 ?refvol_char . }
          OPTIONAL { ?deriv_char pr:P1810 ?valuenum_char . }
          OPTIONAL { ?deriv_char pr:P7421 ?refline_char . }
          OPTIONAL { ?deriv_char pr:P304 ?refpage_char . }
          OPTIONAL { ?deriv_char pq:P3903 ?refcol_char . }
          BIND(COALESCE(?inettvol_char, "") AS ?inetvol_char)
          BIND(COALESCE(?refvol_char, "") AS ?refvoll_char)
          BIND(COALESCE(CONCAT(?valuenum_char, " "), "") AS ?thenum_char)
          BIND(COALESCE(CONCAT("v. ", ?refvol_char, " "), "") AS ?thevol_char)
          BIND(COALESCE(CONCAT("p. ",?refpage_char,""), "") AS ?thepage_char)
          BIND(COALESCE(CONCAT(" c. ",?refcol_char,""), "") AS ?thecol_char)
          BIND(COALESCE(CONCAT(" l. ",?refline_char), "") AS ?theline_char)
          BIND(CONCAT(?thenum_char, ?thevol_char, ?thepage_char, ?thecol_char, ?theline_char) AS ?refnumber_char)
          BIND(IF(BOUND(?offset_char), COALESCE(xsd:integer(?refpage_char)+xsd:integer(?offset_char),?refpage_char), ?refpage_char) AS ?realpage_char)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_char,COALESCE(CONCAT("/page/n",STR(?realpage_char),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_char rdfs:label ?titlee_char .
          FILTER(?inetvol_char = ?refvoll_char)
          FILTER (LANG(?titlee_char) = 'en')
          BIND(CONCAT(?titlee_char," [",?refnumber_char,"]") AS ?title_char)    
          BIND(COALESCE(?title_char, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_char),""),"&highlight=",STR(?refnumber_char),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_char), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(14 AS ?order)
    BIND("Derived from" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Derived from" AS ?description)
        wd:${ l } p:P5191 ?value_statement_derived .
        ?value_statement_derived ps:P5191 ?value_derived .
        OPTIONAL { ?value_statement_derived pq:P5980 / skos:definition ?objsense_derived . FILTER(LANG(?objsense_derived)="en") }
        ?value_derived wikibase:lemma ?valuela_derived .
        
        BIND(CONCAT(?valuela_derived, COALESCE(CONCAT(" [", ?objsense_derived, "]"), "")) AS ?valuelabel_comb_derived)
        BIND(CONCAT("../l?qLabel=", ?valuelabel_comb_derived, "&displaylang=en&l=", SUBSTR(STR(?value_derived), 32)) AS ?value_Url_flat)
        
        ?value_derived wdt:P407 ?lang_derived .
        ?lang_derived rdfs:label ?langLabel_derived .
        FILTER (LANG(?langLabel_derived) = 'en')
        BIND(CONCAT(?valuela_derived, " (", ?langLabel_derived, ")") AS ?valueLabel_flat)
        
        OPTIONAL {	  
          ?value_statement_derived prov:wasDerivedFrom ?deriv_derived .
          ?deriv_derived pr:P248 ?source_derived . 
          OPTIONAL { ?source_derived p:P724 ?inetarchive_stat_derived . ?inetarchive_stat_derived ps:P724 ?inetarchive_derived . OPTIONAL{?inetarchive_stat_derived pq:P8330 ?offset_derived .} OPTIONAL{?inetarchive_stat_derived pq:P478 ?inettvol_derived . }}
          OPTIONAL { ?deriv_derived pr:P478 ?refvol_derived . }
          OPTIONAL { ?deriv_derived pr:P1810 ?valuenum_derived . }
          OPTIONAL { ?deriv_derived pr:P7421 ?refline_derived . }
          OPTIONAL { ?deriv_derived pr:P304 ?refpage_derived . }
          OPTIONAL { ?deriv_derived pq:P3903 ?refcol_derived . }
          BIND(COALESCE(?inettvol_derived, "") AS ?inetvol_derived)
          BIND(COALESCE(?refvol_derived, "") AS ?refvoll_derived)
          BIND(COALESCE(CONCAT(?valuenum_derived, " "), "") AS ?thenum_derived)
          BIND(COALESCE(CONCAT("v. ", ?refvol_derived, " "), "") AS ?thevol_derived)
          BIND(COALESCE(CONCAT("p. ",?refpage_derived,""), "") AS ?thepage_derived)
          BIND(COALESCE(CONCAT(" c. ",?refcol_derived,""), "") AS ?thecol_derived)
          BIND(COALESCE(CONCAT(" l. ",?refline_derived), "") AS ?theline_derived)
          BIND(CONCAT(?thenum_derived, ?thevol_derived, ?thepage_derived, ?thecol_derived, ?theline_derived) AS ?refnumber_derived)
          BIND(IF(BOUND(?offset_derived), COALESCE(xsd:integer(?refpage_derived)+xsd:integer(?offset_derived),?refpage_derived), ?refpage_derived) AS ?realpage_derived)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_derived,COALESCE(CONCAT("/page/n",STR(?realpage_derived),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_derived rdfs:label ?titlee_derived .
          FILTER(?inetvol_derived = ?refvoll_derived)
          FILTER (LANG(?titlee_derived) = 'en')
          BIND(CONCAT(?titlee_derived," [",?refnumber_derived,"]") AS ?title_derived)    
          BIND(COALESCE(?title_derived, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_derived),""),"&highlight=",STR(?refnumber_derived),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_derived), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(19 AS ?order)
    BIND("Lexeme derived from this lexeme" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Lexeme derived from this lexeme" AS ?description)
        ?value_derivedthis p:P5191 ?value_statement_derivedthis . 
        ?value_statement_derivedthis ps:P5191 wd:${ l } .
        OPTIONAL { ?value_derivedthis pq:P5980 / skos:definition ?objsense_derivedthis . FILTER(LANG(?objsense_derivedthis)="en") }
        ?value_derivedthis wikibase:lemma ?valuela_derivedthis .
        
        BIND(CONCAT(?valuela_derivedthis, COALESCE(CONCAT(" [", ?objsense_derivedthis, "]"), "")) AS ?valuelabel_comb_derivedthis)
        BIND(CONCAT("../l?qLabel=", ?valuelabel_comb_derivedthis, "&displaylang=en&l=", SUBSTR(STR(?value_derivedthis), 32)) AS ?value_Url_flat)
        
        ?value_derivedthis wdt:P407 ?lang_derivedthis .
        ?lang_derivedthis rdfs:label ?langLabel_derivedthis .
        FILTER (LANG(?langLabel_derivedthis) = 'en')
        BIND(CONCAT(?valuela_derivedthis, " (", ?langLabel_derivedthis, ")") AS ?valueLabel_flat)
        
        OPTIONAL {	  
          ?value_statement_derivedthis prov:wasDerivedFrom ?deriv_derivedthis .
          ?deriv_derivedthis pr:P248 ?source_derivedthis . 
          OPTIONAL { ?source_derivedthis p:P724 ?inetarchive_stat_derivedthis . ?inetarchive_stat_derivedthis ps:P724 ?inetarchive_derivedthis . OPTIONAL{?inetarchive_stat_derivedthis pq:P8330 ?offset_derivedthis .} OPTIONAL{?inetarchive_stat_derivedthis pq:P478 ?inettvol_derivedthis . }}
          OPTIONAL { ?deriv_derivedthis pr:P478 ?refvol_derivedthis . }
          OPTIONAL { ?deriv_derivedthis pr:P1810 ?valuenum_derivedthis . }
          OPTIONAL { ?deriv_derivedthis pr:P7421 ?refline_derivedthis . }
          OPTIONAL { ?deriv_derivedthis pr:P304 ?refpage_derivedthis . }
          OPTIONAL { ?deriv_derivedthis pq:P3903 ?refcol_derivedthis . }
          BIND(COALESCE(?inettvol_derivedthis, "") AS ?inetvol_derivedthis)
          BIND(COALESCE(?refvol_derivedthis, "") AS ?refvoll_derivedthis)
          BIND(COALESCE(CONCAT(?valuenum_derivedthis, " "), "") AS ?thenum_derivedthis)
          BIND(COALESCE(CONCAT("v. ", ?refvol_derivedthis, " "), "") AS ?thevol_derivedthis)
          BIND(COALESCE(CONCAT("p. ",?refpage_derivedthis,""), "") AS ?thepage_derivedthis)
          BIND(COALESCE(CONCAT(" c. ",?refcol_derivedthis,""), "") AS ?thecol_derivedthis)
          BIND(COALESCE(CONCAT(" l. ",?refline_derivedthis), "") AS ?theline_derivedthis)
          BIND(CONCAT(?thenum_derivedthis, ?thevol_derivedthis, ?thepage_derivedthis, ?thecol_derivedthis, ?theline_derivedthis) AS ?refnumber_derivedthis)
          BIND(IF(BOUND(?offset_derivedthis), COALESCE(xsd:integer(?refpage_derivedthis)+xsd:integer(?offset_derivedthis),?refpage_derivedthis), ?refpage_derivedthis) AS ?realpage_derivedthis)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_derivedthis,COALESCE(CONCAT("/page/n",STR(?realpage_derivedthis),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_derivedthis rdfs:label ?titlee_derivedthis .
          FILTER(?inetvol_derivedthis = ?refvoll_derivedthis)
          FILTER (LANG(?titlee_derivedthis) = 'en')
          BIND(CONCAT(?titlee_derivedthis," [",?refnumber_derivedthis,"]") AS ?title_derivedthis)    
          BIND(COALESCE(?title_derivedthis, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_derivedthis),""),"&highlight=",STR(?refnumber_derivedthis),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_derivedthis), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(15 AS ?order)
    BIND("Homographs" AS ?description)
    wd:${ l } wdt:P5402 ?value_homo .
    ?value_homo wikibase:lemma ?valueLabel_flat .
    BIND(CONCAT("../l?qLabel=",?valueLabel_flat,"&displaylang=en&l=",SUBSTR(STR(?value_homo), 32)) AS ?value_Url_flat)
  }
  UNION 
  {
    BIND(16 AS ?order)

      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {

          OPTIONAL { ?deriv_trans pr:P1810 ?valuenum_trans . }

          BIND(COALESCE(CONCAT("v. ", ?refvol_trans, " "), "") AS ?thevol_trans)
          BIND(COALESCE(CONCAT("p. ",?refpage_trans,""), "") AS ?thepage_trans)
          BIND(COALESCE(CONCAT(" c. ",?refcol_trans,""), "") AS ?thecol_trans)
          BIND(COALESCE(CONCAT(" l. ",?refline_trans), "") AS ?theline_trans)
          BIND(CONCAT(?thenum_trans, ?thevol_trans, ?thepage_trans, ?thecol_trans, ?theline_trans) AS ?refnumber_trans)
          BIND(IF(BOUND(?offset_trans), COALESCE(xsd:integer(?refpage_trans)+xsd:integer(?offset_trans),?refpage_trans), ?refpage_trans) AS ?realpage_trans)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_trans,COALESCE(CONCAT("/page/n",STR(?realpage_trans),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_trans rdfs:label ?titlee_trans .
          FILTER(?inetvol_trans = ?refvoll_trans)
          FILTER (LANG(?titlee_trans) = 'en')
          BIND(CONCAT(?titlee_trans," [",?refnumber_trans,"]") AS ?title_trans)    
          BIND(COALESCE(?title_trans, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_trans),""),"&highlight=",STR(?refnumber_trans),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_trans), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(17 AS ?order)
    BIND("Time Period" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat WHERE {
        BIND("Time Period" AS ?description)
        wd:${ l } p:P2348 ?value_statement_time .
        ?value_statement_time ps:P2348 ?valueurl_time .
        ?valueurl_time rdfs:label ?valuelab_time .
        FILTER (LANG(?valuelab_time) = 'en')
        
        BIND(IF(BOUND(?langLabel) && ?langLabel != "", CONCAT(?valuelab_time, " (", ?langLabel, ")"), ?valuelab_time) AS ?valueLabel_flat)
        BIND(?valueurl_time AS ?value_Url_flat)
        
        OPTIONAL {	  
          ?value_statement_time prov:wasDerivedFrom ?deriv_time .
          ?deriv_time pr:P248 ?source_time . 
          OPTIONAL { ?source_time p:P724 ?inetarchive_stat_time . ?inetarchive_stat_time ps:P724 ?inetarchive_time . OPTIONAL{?inetarchive_stat_time pq:P8330 ?offset_time .} OPTIONAL{?inetarchive_stat_time pq:P478 ?inettvol_time . }}
          OPTIONAL { ?deriv_time pr:P478 ?refvol_time . }
          OPTIONAL { ?deriv_time pr:P1810 ?valuenum_time . }
          OPTIONAL { ?deriv_time pr:P7421 ?refline_time . }
          OPTIONAL { ?deriv_time pr:P304 ?refpage_time . }

          BIND(COALESCE(CONCAT(?valuenum_time, " "), "") AS ?thenum_time)
          BIND(COALESCE(CONCAT("v. ", ?refvol_time, " "), "") AS ?thevol_time)
          BIND(COALESCE(CONCAT("p. ",?refpage_time,""), "") AS ?thepage_time)
          BIND(COALESCE(CONCAT(" c. ",?refcol_time,""), "") AS ?thecol_time)
          BIND(COALESCE(CONCAT(" l. ",?refline_time), "") AS ?theline_time)
          BIND(CONCAT(?thenum_time, ?thevol_time, ?thepage_time, ?thecol_time, ?theline_time) AS ?refnumber_time)
          BIND(IF(BOUND(?offset_time), COALESCE(xsd:integer(?refpage_time)+xsd:integer(?offset_time),?refpage_time), ?refpage_time) AS ?realpage_time)
          BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_time,COALESCE(CONCAT("/page/n",STR(?realpage_time),"/mode/1up?view=theater"),"")),"#") AS ?sourcelink_flat)
          ?source_time rdfs:label ?titlee_time .
          FILTER(?inetvol_time = ?refvoll_time)
          FILTER (LANG(?titlee_time) = 'en')
          BIND(CONCAT(?titlee_time," [",?refnumber_time,"]") AS ?title_time)    
          BIND(COALESCE(?title_time, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reflistlang?l=&qLabel=",COALESCE(STR(?title_time),""),"&highlight=",STR(?refnumber_time),"&displaylang=en&q=",COALESCE(SUBSTR(STR(?source_time), 32),"")) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat ?sourcelink_flat
    }
  }
  UNION 
  {
    BIND(18 AS ?order)
    BIND("Compound" AS ?description)		
    wd:${ l } p:P5238 ?comb_compound . 
    ?comb_compound ps:P5238 ?value_compound .
    ?comb_compound pq:P1545 ?seriesordinal_compound . 
    ?comb_compound pq:P5548 ?form_compound . 
    ?form_compound ontolex:representation ?forml_compound . 
    
    ?comb_compound pq:P5980 ?combsense_compound . 
    OPTIONAL { ?combsense_compound wdt:P5137|wdt:P9970 ?combsenseval_compound . }
    ?combsense_compound skos:definition ?combsensedeff_compound .
    FILTER (LANG(?combsensedeff_compound) = 'en')
    
    BIND(CONCAT(?forml_compound," (",?combsensedeff_compound,")") AS ?valueLabel_flat)
    BIND(CONCAT("../l?&qLabel=",?valueLabel_flat,"&displaylang=en&l=",SUBSTR(STR(?value_compound), 32)) AS ?value_Url_flat)

  {
    BIND(20 AS ?order)

    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat WHERE {
        BIND("Described in" AS ?description)
        wd:${ l } dct:language ?language_desc .
        wd:${ l } ontolex:lexicalForm? / p:P1343 ?value_statement_desc .
        ?value_statement_desc ps:P1343 ?value_desc .
        ?value_desc rdfs:label ?valueLab_desc .
        FILTER (LANG(?valueLab_desc) = 'en')
        
        OPTIONAL { ?value_desc p:P724 ?inetarchive_stat_desc . ?inetarchive_stat_desc ps:P724 ?inetarchive_desc . OPTIONAL{?inetarchive_stat_desc pq:P8330 ?offset_desc .} OPTIONAL{?inetarchive_stat_desc pq:P478 ?inettvol_desc . }}
        OPTIONAL { ?value_statement_desc pq:P478 ?refvol_desc . }
        OPTIONAL { ?value_statement_desc pq:P1810 ?valuenum_desc . }
        OPTIONAL { ?value_statement_desc pq:P7421 ?refline_desc . }
        OPTIONAL { ?value_statement_desc pq:P304 ?refpage_desc . }
        OPTIONAL { ?value_statement_desc pq:P3903 ?refcol_desc . }
        
        BIND(COALESCE(?inettvol_desc, "") AS ?inetvol_desc)
        BIND(COALESCE(?refvol_desc, "") AS ?refvoll_desc)
        BIND(COALESCE(CONCAT(?valuenum_desc, " "), "") AS ?thenum_desc)
        BIND(COALESCE(CONCAT("v. ", ?refvol_desc, " "), "") AS ?thevol_desc)
        BIND(COALESCE(CONCAT("p. ",?refpage_desc,""), "") AS ?thepage_desc)
        BIND(COALESCE(CONCAT(" c. ",?refcol_desc,""), "") AS ?thecol_desc)
        BIND(COALESCE(CONCAT(" l. ",?refline_desc), "") AS ?theline_desc)
        BIND(CONCAT(?thenum_desc, ?thevol_desc, ?thepage_desc, ?thecol_desc, ?theline_desc) AS ?refnumber_desc)
        
        BIND(IF(BOUND(?offset_desc), xsd:integer(?refpage_desc)+xsd:integer(?offset_desc), ?refpage_desc) AS ?realpage_desc)
        
        FILTER (?inetvol_desc = ?refvoll_desc)
        
        BIND(CONCAT(?valueLab_desc," [",?refnumber_desc,"]") AS ?valueLabel_flat)
        BIND(CONCAT("../reflistlang?l=",SUBSTR(STR(?language_desc), 32),"&q=", SUBSTR(STR(?value_desc), 32),"&qLabel=",STR(?valueLabel_flat),"&highlight=",STR(?refnumber_desc),"&displaylang=en") AS ?value_Url_flat)
        BIND(COALESCE(CONCAT("https://archive.org/details/",?inetarchive_desc,COALESCE(CONCAT("/page/n",STR(?realpage_desc),"/mode/1up?view=theater"),"")),"") AS ?sourceUrl_flat)
        BIND(IF(BOUND(?inetarchive_desc), "↗", "") AS ?source_flat)
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat
    }
  }
  UNION 
  {
    BIND(30 AS ?order)
    BIND("First attested from" AS ?description)
    wd:${ l } p:P6684 ?value_statement_att1 .
    ?value_statement_att1 ps:P6684 ?value_att1 .
    ?value_att1 rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = "en")
    BIND(CONCAT("../reference?q=", SUBSTR(STR(?value_att1), 32)) AS ?value_Url_flat)
    OPTIONAL {
      ?value_statement_att1 prov:wasDerivedFrom / pr:P854 ?sourceUrl_flat .
      OPTIONAL { ?value_statement_att1 pq:P577 ?date_att1 }
      BIND(COALESCE(CONCAT(STR(YEAR(?date_att1)), "-", STR(MONTH(?date_att1)), "-", STR(DAY(?date_att1))), "↗") AS ?source_flat)
    }
  }
  UNION 
  {
    BIND(31 AS ?order)
    BIND("Attested in" AS ?description)
    wd:${ l } ontolex:lexicalForm? / p:P5323 ?value_statement_att2 .
    ?value_statement_att2 ps:P5323 ?value_att2 .
    ?value_att2 rdfs:label ?valueLabel_direct .
    FILTER (LANG(?valueLabel_direct) = "en")
    BIND(CONCAT("../reference?q=", SUBSTR(STR(?value_att2), 32)) AS ?value_Url_flat)
    OPTIONAL {
      ?value_statement_att2 prov:wasDerivedFrom / pr:P854 ?sourceUrl_flat .
      OPTIONAL { ?value_statement_att2 pq:P577 ?date_att2_deriv }
      BIND(COALESCE(CONCAT(STR(YEAR(?date_att2_deriv)), "-", STR(MONTH(?date_att2_deriv)), "-", STR(DAY(?date_att2_deriv)), " ↗"), "↗") AS ?source_flat)
    }
    OPTIONAL {
      ?value_att2 wdt:P577 ?date_att2_direct . 
      BIND(CONCAT(STR(YEAR(?date_att2_direct)), "-", STR(MONTH(?date_att2_direct)), "-", STR(DAY(?date_att2_direct))) AS ?source_flat)
    }
  }
  UNION 
  {
    BIND(32 AS ?order)
    BIND("Usage example" AS ?description)
    {
      SELECT ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat WHERE {
        BIND("Usage example" AS ?description)
        wd:${ l } p:P5831 ?value_statement_usage .
        ?value_statement_usage ps:P5831 ?value_usage .
        BIND(CONCAT("../text-to-lexemes?text=", ENCODE_FOR_URI(?value_usage), "&text-language=", LANG(?value_usage)) AS ?value_Url_flat)
        OPTIONAL {
          ?value_statement_usage pq:P2441 ?literal_translation_usage .
          FILTER(LANG(?literal_translation_usage)="en")  
        }
        BIND(CONCAT(?value_usage, COALESCE(CONCAT(" [",?literal_translation_usage,"]"),"")) AS ?valueLabel_flat)
        OPTIONAL {
          ?value_statement_usage prov:wasDerivedFrom ?deriv_usage .
          ?deriv_usage pr:P248 ?source__usage . 
          OPTIONAL { ?deriv_usage pr:P478 ?refvol_usage . }
          OPTIONAL { ?deriv_usage pr:P1810 ?valuenum_usage . }
          OPTIONAL { ?deriv_usage pr:P7421 ?refline_usage . }
          OPTIONAL { ?deriv_usage pr:P304 ?refpage_usage . }
          OPTIONAL { ?deriv_usage pq:P3903 ?refcol_usage . }
          BIND(COALESCE(CONCAT(?valuenum_usage, " "), "") AS ?thenum_usage)
          BIND(COALESCE(CONCAT("v. ", ?refvol_usage, " "), "") AS ?thevol_usage)
          BIND(COALESCE(CONCAT("p. ",?refpage_usage), "") AS ?thepage_usage)
          BIND(COALESCE(CONCAT(" c. ",?refcol_usage), "") AS ?thecol_usage)
          BIND(COALESCE(CONCAT(" l. ",?refline_usage), "") AS ?theline_usage)
          BIND(CONCAT(?thenum_usage, ?thevol_usage, ?thepage_usage, ?thecol_usage, ?theline_usage) AS ?refnumber_usage)
          ?source__usage rdfs:label ?titlee_usage .
          FILTER (LANG(?titlee_usage) = 'en')
          BIND(CONCAT(?titlee_usage," [",?refnumber_usage,"]") AS ?title_usage)    
          BIND(COALESCE(?title_usage, "Ref.") AS ?source_flat)
          BIND(CONCAT("../reference?q=", SUBSTR(STR(?source__usage), 32)) AS ?sourceUrl_flat)
        }
      } GROUP BY ?description ?value_Url_flat ?valueLabel_flat ?source_flat ?sourceUrl_flat
    }
  }
}
GROUP BY ?description ?order
ORDER BY ?order

`

idSparql= `
# List of ids for a specific character
SELECT DISTINCT
  ?idprop ?idpropLabel (CONCAT(?formaturl,?id) AS ?idUrl) ?id
WHERE {
  VALUES ?lexeme { wd:${ l } }
  ?lexeme ?idprop ?id .
  ?idpropp wikibase:directClaim ?idprop ; wikibase:propertyType wikibase:ExternalId .
  OPTIONAL {
    ?idpropp wdt:P1630 ?formatur .
    BIND(REPLACE(STR(?formatur), "\\\\$1", "", "i") AS ?formaturl)
  }
  ?idpropp rdfs:label ?idpropLabel .
  FILTER(lang(?idpropLabel)="en")
}
`


 formsSparql = `
 # List of forms for a specific lexeme
 SELECT
  ?form (GROUP_CONCAT(DISTINCT ?formlabel; separator=" // ") AS ?formLabel)
   (GROUP_CONCAT(DISTINCT ?formlabellang; separator=" // ") AS ?language)
   (GROUP_CONCAT(DISTINCT ?feature; separator=" // ") AS ?features)
   (GROUP_CONCAT(DISTINCT ?featureLabel; separator=" // ") AS ?featuresLabel)   
# (GROUP_CONCAT(DISTINCT ?hyphenation; separator=" // ") AS ?hyphenations)
 WHERE {
   wd:${ l } ontolex:lexicalForm ?form .
   ?form ontolex:representation ?formlabel .
   BIND(lang(?formlabel) AS ?formlabellang)
   OPTIONAL {
     ?form wikibase:grammaticalFeature ?feature .
     ?feature rdfs:label ?featureLabel .
     FILTER (LANG(?featureLabel) = "en")
   }
   OPTIONAL {
    ?form wdt:P5279 ?hyphenation
   }
 }
 GROUP BY ?form
 ORDER BY (STR(?form))
 `

 sensesSparql = `
# List of senses for a specific lexeme
 SELECT
  ?sense ?senseLabel ?glossUrl
  (GROUP_CONCAT(DISTINCT ?glloss; separator=" // ") AS ?gloss)
  (IRI(CONCAT("https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file&width=200&wpvalue=", 
          SUBSTR(STR(SAMPLE(?images)), 52))) AS ?sense_image)
 WHERE {
   wd:${ l } ontolex:sense ?sense .
   BIND(SUBSTR(STR(?sense), 32) AS ?senseLabel)
   ?sense skos:definition ?glosss .
   OPTIONAL {
     ?sense wdt:P5137|wdt:P9970 ?glossUrl .
   }
   OPTIONAL {
   {
     ?sense wdt:P18 ?images
   }UNION {
	?sense wdt:P5137|wdt:P9970 ?glossUrl .
	?glossUrl wdt:P18 ?images .
   }
   }
   BIND(CONCAT(?glosss,"@",lang(?glosss)) AS ?glloss)
 }
 GROUP BY ?sense ?senseLabel ?glossUrl
 ORDER BY (STR(?sense))
`

translationSparql=`
SELECT DISTINCT (GROUP_CONCAT(DISTINCT ?lexemea; separator=" // ") as ?lexemeLabel) 
    ?lexcat ?lexcatLabel
	(GROUP_CONCAT(DISTINCT ?senseval; separator=" // ") as ?sense)
	(GROUP_CONCAT(DISTINCT ?senselabel; separator=" // ") as ?senseLabel)    
    ?translation ?translationLabel ?language ?languageLabel ?translationlexeme 
    (GROUP_CONCAT(DISTINCT ?lexeme2a; separator=" // ") as ?translationlexemeLabel) 
	WHERE {	
	  wd:${ l } rdf:type ontolex:LexicalEntry ;           
		 dct:language ?lexlang ;		   
		 wikibase:lemma ?lexemea ;
		 wikibase:lexicalCategory ?lexcat .
	  ?lexcat rdfs:label ?lexcatLabel . FILTER(LANG(?lexcatLabel)= "en")
      wd:${ l } ontolex:sense ?sense .
      {
        wd:${ l } wdt:P11577 ?translationlexeme . ?translationlexeme ontolex:sense ?translation .
      }UNION
      {
        ?sense wdt:P5972 ?translation . 
        ?translationlexeme ontolex:sense ?translation .
      }
	  ?translation skos:definition ?translationLabel .  FILTER(LANG(?translationLabel)= "en") 
      ?sense skos:definition ?gloss .  FILTER(LANG(?gloss)= "en") 
      OPTIONAL {?sense wdt:P5137|wdt:P9970 ?senseval . ?senseval rdfs:label ?senselab .  FILTER(LANG(?senselab)= "en")}
      BIND(CONCAT(?gloss, COALESCE(CONCAT(" [", ?senselab, " (", REPLACE(STR(?senseval), "http://www.wikidata.org/entity/", ""), ")", "]"),"")) AS ?senselabel)   
      ?translationlexeme wikibase:lemma ?lexeme2a .
      ?translationlexeme dct:language ?language .	  
      OPTIONAL{?translationlexeme wdt:P7481 ?dialect . ?dialect rdfs:label ?dialectLabel . FILTER(LANG(?dialectLabel)= "en") }
      ?language rdfs:label ?languageeLabel .
      FILTER(LANG(?languageeLabel)= "en")
      BIND(CONCAT(?languageeLabel,COALESCE(CONCAT(" <",?dialectLabel,">"),"")) AS ?languageLabel)
      }
    GROUP BY ?lexeme ?lexcat ?lexcatLabel ?translation ?translationLabel ?language ?languageLabel ?translationlexeme
	ORDER BY ?lexemeLabel
`

compoundsSparql = `
SELECT
  ?lexeme (GROUP_CONCAT(?lexemelabel; separator=" // ") AS ?lexemeLabel) 
  ?lexical_category ?lexical_categoryLabel ?compounds ?compoundsLabel
  (GROUP_CONCAT(DISTINCT ?sensse; SEPARATOR = " // ") AS ?senses) 
(GROUP_CONCAT(DISTINCT ?senseLabell; SEPARATOR = " // ") AS ?sensesLabel)
WHERE {
  {
    SELECT
      ?lexeme
      (GROUP_CONCAT(?compound; separator=" // ") AS ?compounds)
      (GROUP_CONCAT(DISTINCT ?compoundLabel; separator=" // ") AS ?compoundsLabel)
    WHERE {
	  SELECT ?lexeme ?compound ?compoundLabel ?sensedef WHERE {
      ?lexeme wdt:P5238 wd:${ l } .
      OPTIONAL {
        ?lexeme p:P5238 ?compoundstat .
        ?compoundstat ps:P5238 ?compound .
        ?compound wikibase:lemma ?compoundlabel .
        #FILTER (?compound != wd:L703986)
		?compoundstat pq:P1545 ?seriesordinal .
        OPTIONAL {
          ?compoundstat pq:P5980 ?sense .
          ?sense skos:definition ?sensedeff .
		  FILTER(LANG(?sensedeff) = "en")		  
        }   
        BIND(COALESCE(CONCAT(" [",?sensedeff,"]"), "") AS ?sensedef)
        BIND(CONCAT(?compoundlabel,?sensedef) AS ?compoundLabel)
      }
	}
    ORDER BY xsd:integer(?seriesordinal)
    }
    GROUP BY ?lexeme ?sensedefs
  }UNION{
    SELECT ?lexeme (GROUP_CONCAT(?lexeme; separator=" // ") AS ?compounds)
      (GROUP_CONCAT(DISTINCT ?compoundLabel; separator=" // ") AS ?compoundsLabel) WHERE {
      ?lexeme wdt:P5191 wd:${ l } .
      ?lexeme wikibase:lemma ?compoundlabel .
      OPTIONAL {
          ?lexeme ontolex:sense ?sense .
          ?sense skos:definition ?sensedeff .
		  FILTER(LANG(?sensedeff) = "en")		  
      }  
      BIND(COALESCE(CONCAT(" [",?sensedeff,"]"), "") AS ?sensedef)
      BIND(CONCAT(?compoundlabel,?sensedef) AS ?compoundLabel)
    }GROUP BY ?lexeme
  }
  
  ?lexeme wikibase:lemma ?lexemelabel .
  OPTIONAL {
	  ?lexeme wikibase:lexicalCategory ?lexical_category .
	  ?lexical_category rdfs:label ?lexical_categoryLabel .
	  FILTER (LANG(?lexical_categoryLabel) = 'en')
  }
  OPTIONAL {
    ?lexeme ontolex:sense ?senseitem.
    ?senseitem skos:definition ?gloss.
    OPTIONAL {
      ?senseitem wdt:P5137|wdt:P9970 ?sensee.
      ?sensee rdfs:label ?senseLab.
      FILTER(LANG(?senseLab) = "en")
    }
    FILTER(LANG(?gloss) = "en")
    BIND(COALESCE(?sensee, "") AS ?sensse)
    BIND(CONCAT(?gloss, COALESCE(CONCAT(" [", ?senseLab, " (", REPLACE(STR(?sensee), "http://www.wikidata.org/entity/", ""), ")", "]"),"")) AS ?senseLabell)
  }
}
GROUP BY ?lexeme ?lexical_category ?lexical_categoryLabel ?compounds ?compoundsLabel
