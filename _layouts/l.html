<script type="text/javascript">
 lexemeSparql = `
# Data for a specific lexeme (QLever v14 - Fast & Zero Warnings)
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX dct: <http://purl.org/dc/terms/>
PREFIX p: <http://www.wikidata.org/prop/>
PREFIX ps: <http://www.wikidata.org/prop/statement/>
PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
PREFIX pr: <http://www.wikidata.org/prop/reference/>
PREFIX prov: <http://www.w3.org/ns/prov#>
PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

SELECT
  ?description
  (?valueLabel AS ?value_)
  ?value_Url
  ?source
  ?sourceUrl
  ?sourceLink
WHERE {
  # ===========================================================================
  # 1. ALL OUTGOING DIRECT PROPERTIES ON wd:${ l } (Orders 1-4, 6-8, 10-13, 15-17)
  # ===========================================================================
  {
    SELECT
      ?order
      ?description
      ?groupKey
      (GROUP_CONCAT(DISTINCT ?baseValueLabel; separator=" // ") AS ?valueLabel)
      (GROUP_CONCAT(DISTINCT ?baseValueUrl;   separator=" // ") AS ?value_Url)
    WHERE {
      wd:${ l } ?prop ?value .
      VALUES (?order ?prop ?description ?urlMode ?groupMode) {
        (1  wikibase:lemma            "Lemma"              "literal"      "single")
        (2  dct:language              "Language"           "lang"         "per_val")
        (3  wdt:P7481                 "Dialect"            "raw"          "per_val")
        (4  wikibase:lexicalCategory  "Lexical category"   "lexcat"       "per_val")
        (6  wdt:P5187                 "Word stem"          "literal"      "per_val")
        (7  wdt:P144                  "Based on"           "literal"      "per_val")
        (8  wdt:P5911                 "Paradigm"           "raw"          "per_val")
        (10 wdt:P5185                 "Grammatical gender" "raw"          "per_val")
        (11 wdt:P5186                 "Conjugation class"  "propval"      "per_val")
        (12 wdt:P5401                 "Auxiliary verb"     "lexeme"       "per_val")
        (13 wdt:P1552                 "Characterized by"   "propval_lang" "per_val")
        (15 wdt:P5402                 "Homographs"         "lexeme_link"  "single")
        (16 wdt:P9295                 "Transitivity"       "propval_lang" "per_val")
        (17 wdt:P2348                 "Time Period"        "timeperiod"   "single")
      }
      BIND(SUBSTR(STR(?value), 32) AS ?qid)
      BIND(STRAFTER(STR(?prop), "http://www.wikidata.org/prop/direct/") AS ?pid)

      OPTIONAL { ?value rdfs:label ?enLabel . FILTER(LANG(?enLabel) = "en") }
      OPTIONAL { ?value wikibase:lemma ?lemmaLabel . }
      OPTIONAL {
        FILTER(?urlMode IN ("lexcat", "timeperiod"))
        wd:${ l } dct:language ?langVal .
        OPTIONAL { ?langVal rdfs:label ?langEnLabel . FILTER(LANG(?langEnLabel) = "en") }
      }

      BIND(COALESCE(?lemmaLabel, ?enLabel, STR(?value)) AS ?baseValueLabel)
      BIND(IF(?groupMode = "single", "single", STR(?value)) AS ?groupKey)
      BIND(
        IF(?urlMode = "raw",          ?value,
        IF(?urlMode = "lexeme",       ?qid,
        IF(?urlMode = "lexeme_link",  CONCAT("../l?qLabel=", ?baseValueLabel, "&displaylang=en&l=", ?qid),
        IF(?urlMode = "timeperiod",   CONCAT("../timeperiod?l=", SUBSTR(STR(?langVal), 32), "&displaylang=en&qLabel=", ?baseValueLabel, "&q=", ?qid),
        IF(?urlMode = "lang",         CONCAT("../language?q=", ?qid, "&qLabel=", ?baseValueLabel, "&displaylang=en"),
        IF(?urlMode = "lexcat",       CONCAT("../lexical-category?q=", STR(?value), "&qLabel=", ?baseValueLabel, "&l=", STR(?langVal), "&lLabel=", ?langEnLabel, "&displaylang=en"),
        IF(?urlMode = "propval",      CONCAT("../property_value?p=", ?pid, "&q=", ?qid, "&qLabel=", ?baseValueLabel),
        IF(?urlMode = "propval_lang", CONCAT("../property_value?p=", ?pid, "&q=", ?qid, "&qLabel=", ?baseValueLabel, "&displaylang=en"),
        1/0)))))))) AS ?baseValueUrl
      )
    }
    GROUP BY ?order ?description ?groupKey
  }
  UNION
  # ===========================================================================
  # 2. INSTANCE OF (Order 5)
  # ===========================================================================
  {
    SELECT (5 AS ?order) ("Instance of" AS ?description) ?valueLabel ?value_Url ?source ?sourceUrl
    WHERE {
      wd:${ l } p:P31 ?stmt .
      ?stmt ps:P31 ?value .
      ?value rdfs:label ?valueLabel .
      FILTER(LANG(?valueLabel) = "en")
      BIND(CONCAT("../property_value?p=P31&q=", SUBSTR(STR(?value), 32), "&qLabel=", ?valueLabel) AS ?value_Url)
      OPTIONAL { ?stmt prov:wasDerivedFrom ?deriv . }
      OPTIONAL { ?deriv pr:P248 ?source . }
      BIND(IF(BOUND(?source), CONCAT("../reference?q=", SUBSTR(STR(?source), 32)), 1/0) AS ?sourceUrl)
    }
  }
  UNION
  # ===========================================================================
  # 3. COMPOUND (Order 18)
  # ===========================================================================
  {
    SELECT (18 AS ?order) ("Compound" AS ?description)
           (GROUP_CONCAT(DISTINCT ?vu; separator=" + ") AS ?value_Url)
           (GROUP_CONCAT(?vl; separator=" + ") AS ?valueLabel)
    WHERE {
      {
        SELECT ?value ?comb (GROUP_CONCAT(DISTINCT ?forml; separator=" // ") AS ?formlabel)
        WHERE {
          wd:${ l } p:P5238 ?comb .
          ?comb ps:P5238 ?value ; pq:P1545 ?seriesordinal ; pq:P5548 ?form .
          ?form ontolex:representation ?forml .
        }
        GROUP BY ?value ?comb ?seriesordinal
        ORDER BY xsd:integer(?seriesordinal)
      }
      ?comb pq:P5980 ?combsense .
      ?combsense skos:definition ?combsensedeff .
      FILTER(LANG(?combsensedeff) = "en")
      BIND(CONCAT(?formlabel, " (", ?combsensedeff, ")") AS ?vl)
      BIND(CONCAT("../l?&qLabel=", ?vl, "&displaylang=en&l=", SUBSTR(STR(?value), 32)) AS ?vu)
    }
  }
  UNION
  # ===========================================================================
  # 4. DESCRIBED IN (Order 20 - completely isolated, bound subject probes)
  # ===========================================================================
  {
    SELECT
      (20 AS ?order)
      ("Described in" AS ?description)
      ?valueLabel
      ?value_Url
      ?source
      ?sourceUrl
    WHERE {
      {
        SELECT
          ?stmt ?work ?workTitle ?baseLangId ?inetarchive ?offset ?inettvol
          (SAMPLE(IF(?qPred = pq:P478,  ?qVal, 1/0)) AS ?refvol)
          (SAMPLE(IF(?qPred = pq:P1810, ?qVal, 1/0)) AS ?valuenum)
          (SAMPLE(IF(?qPred = pq:P7421, ?qVal, 1/0)) AS ?refline)
          (SAMPLE(IF(?qPred = pq:P304,  ?qVal, 1/0)) AS ?refpage)
          (SAMPLE(IF(?qPred = pq:P3903, ?qVal, 1/0)) AS ?refcol)
        WHERE {
          wd:${ l } (p:P1343 | ontolex:lexicalForm/p:P1343) ?stmt .
          ?stmt ps:P1343 ?work .
          ?work rdfs:label ?workTitle .
          FILTER(LANG(?workTitle) = "en")

          OPTIONAL { wd:${ l } dct:language ?baseLang . }
          BIND(SUBSTR(STR(?baseLang), 32) AS ?baseLangId)

          OPTIONAL {
            ?stmt ?qPred ?qVal .
            VALUES ?qPred { pq:P478 pq:P1810 pq:P7421 pq:P304 pq:P3903 }
          }
          OPTIONAL { ?work p:P724 ?iaStat . }
          OPTIONAL { ?iaStat ps:P724 ?inetarchive . }
          OPTIONAL { ?iaStat pq:P8330 ?offset . }
          OPTIONAL { ?iaStat pq:P478  ?inettvol . }
        }
        GROUP BY ?stmt ?work ?workTitle ?baseLangId ?inetarchive ?offset ?inettvol
      }
      FILTER(COALESCE(?inettvol, "") = COALESCE(?refvol, ""))
      BIND(CONCAT(
        COALESCE(CONCAT(?valuenum, " "), ""),
        COALESCE(CONCAT("v. ", ?refvol, " "), ""),
        COALESCE(CONCAT("p. ", ?refpage), ""),
        COALESCE(CONCAT(" c. ", ?refcol), ""),
        COALESCE(CONCAT(" l. ", ?refline), "")
      ) AS ?refnumber)
      BIND(IF(BOUND(?offset), COALESCE(xsd:integer(?refpage) + xsd:integer(?offset), ?refpage), ?refpage) AS ?realpage)
      BIND(COALESCE(CONCAT("https://archive.org/details/", ?inetarchive, COALESCE(CONCAT("/page/n", STR(?realpage), "/mode/1up?view=theater"), "")), "") AS ?sourceUrl)
      BIND(IF(BOUND(?inetarchive), "↗", "") AS ?source)
      BIND(CONCAT(?workTitle, " [", ?refnumber, "]") AS ?valueLabel)
      BIND(CONCAT("../reflistlang?l=", COALESCE(?baseLangId, ""), "&q=", SUBSTR(STR(?work), 32), "&qLabel=", STR(?valueLabel), "&highlight=", STR(?refnumber), "&displaylang=en") AS ?value_Url)
    }
  }
  UNION
  # ===========================================================================
  # 5. ATTESTATIONS: FIRST ATTESTED FROM (30) & ATTESTED IN (31)
  # ===========================================================================
  {
    SELECT ?order ?description ?valueLabel ?value_Url ?source ?sourceUrl
    WHERE {
      {
        BIND(30 AS ?order)
        BIND("First attested from" AS ?description)
        wd:${ l } p:P6684 ?stmt .
        ?stmt ps:P6684 ?value .
      }
      UNION
      {
        BIND(31 AS ?order)
        BIND("Attested in" AS ?description)
        wd:${ l } (p:P5323 | ontolex:lexicalForm/p:P5323) ?stmt .
        ?stmt ps:P5323 ?value .
      }
      ?value rdfs:label ?valueLabel .
      FILTER(LANG(?valueLabel) = "en")
      BIND(CONCAT("../reference?q=", SUBSTR(STR(?value), 32)) AS ?value_Url)

      OPTIONAL { ?stmt prov:wasDerivedFrom ?deriv . }
      OPTIONAL { ?deriv pr:P854 ?sourceUrl . }
      OPTIONAL { ?stmt pq:P577 ?stmtDate . }
      OPTIONAL { FILTER(?order = 31) ?value wdt:P577 ?workDate . }

      BIND(
        IF(BOUND(?sourceUrl),
          COALESCE(CONCAT(STR(YEAR(?stmtDate)), "-", STR(MONTH(?stmtDate)), "-", STR(DAY(?stmtDate)), IF(?order = 31, " ↗", "")), "↗"),
          IF(BOUND(?workDate), CONCAT(STR(YEAR(?workDate)), "-", STR(MONTH(?workDate)), "-", STR(DAY(?workDate))), 1/0)
        ) AS ?source
      )
    }
  }
  UNION
  # ===========================================================================
  # 6. DERIVED / ROOT / USAGE CLAIMS WITH prov:wasDerivedFrom (Orders 9, 14, 19, 32)
  # ===========================================================================
  {
    SELECT
      ?order
      ?description
      ?groupKey
      (GROUP_CONCAT(DISTINCT ?baseValueLabel; separator=" // ") AS ?valueLabel)
      (GROUP_CONCAT(DISTINCT ?baseValueUrl;   separator=" // ") AS ?value_Url)
      (GROUP_CONCAT(DISTINCT ?rowSource;      separator=" <br/> ") AS ?source)
      (GROUP_CONCAT(DISTINCT ?rowSourceUrl;   separator=" <br/> ") AS ?sourceUrl)
      (GROUP_CONCAT(DISTINCT ?rowSourceLink;  separator=" // ") AS ?sourceLink)
    WHERE {
      {
        SELECT
          ?order ?description ?groupKey ?baseValueLabel ?baseValueUrl ?refMode ?work ?workTitle ?baseLangId ?inetarchive ?offset
          (SAMPLE(IF(?rPred = pr:P478,  ?rVal, 1/0)) AS ?refvol)
          (SAMPLE(IF(?rPred = pr:P1810, ?rVal, 1/0)) AS ?valuenum)
          (SAMPLE(IF(?rPred = pr:P7421, ?rVal, 1/0)) AS ?refline)
          (SAMPLE(IF(?rPred = pr:P304,  ?rVal, 1/0)) AS ?refpage)
          (SAMPLE(IF(?rPred = pq:P3903, ?rVal, 1/0)) AS ?refcol)
        WHERE {
          {
            {
              BIND(9 AS ?order)
              BIND("Root" AS ?description)
              BIND(false AS ?includeLang)
              wd:${ l } p:P5920 ?stmt .
              ?stmt ps:P5920 ?value .
            }
            UNION
            {
              BIND(14 AS ?order)
              BIND("Derived from" AS ?description)
              BIND(true AS ?includeLang)
              wd:${ l } p:P5191 ?stmt .
              ?stmt ps:P5191 ?value .
            }
            UNION
            {
              BIND(19 AS ?order)
              BIND("Lexeme derived from this lexeme" AS ?description)
              BIND(true AS ?includeLang)
              ?stmt ps:P5191 wd:${ l } .
              ?value p:P5191 ?stmt .
            }
            ?value wikibase:lemma ?valuela .
            OPTIONAL { ?stmt pq:P5980 ?senseObj . }
            OPTIONAL { ?senseObj skos:definition ?objsense . FILTER(LANG(?objsense) = "en") }
            OPTIONAL { FILTER(?includeLang) ?value dct:language ?lang . }
            OPTIONAL { ?lang rdfs:label ?langLabel . FILTER(LANG(?langLabel) = "en") }

            BIND(COALESCE(?langLabel, "none") AS ?groupKey)
            BIND(IF(?includeLang && BOUND(?langLabel), CONCAT(?valuela, " (", ?langLabel, ")"), ?valuela) AS ?valuelab)
            BIND(CONCAT(?valuelab, COALESCE(CONCAT(" [", ?objsense, "]"), "")) AS ?baseValueLabel)
            BIND(CONCAT("../l?qLabel=", ?baseValueLabel, "&displaylang=en&l=", SUBSTR(STR(?value), 32)) AS ?baseValueUrl)
            BIND("ref" AS ?refMode)
          }
          UNION
          {
            BIND(32 AS ?order)
            BIND("Usage example" AS ?description)
            wd:${ l } p:P5831 ?stmt .
            ?stmt ps:P5831 ?value .
            BIND(CONCAT("../text-to-lexemes?text=", ENCODE_FOR_URI(?value), "&text-language=", LANG(?value)) AS ?baseValueUrl)
            OPTIONAL { ?stmt pq:P2441 ?lit . FILTER(LANG(?lit) = "en") }
            BIND(CONCAT(?value, COALESCE(CONCAT(" [", ?lit, "]"), "")) AS ?baseValueLabel)
            BIND(?baseValueLabel AS ?groupKey)
            BIND("usage" AS ?refMode)
          }

          OPTIONAL { wd:${ l } dct:language ?baseLang . }
          BIND(SUBSTR(STR(?baseLang), 32) AS ?baseLangId)

          OPTIONAL { ?stmt prov:wasDerivedFrom ?deriv . }
          OPTIONAL { ?deriv pr:P248 ?work . }
          OPTIONAL { ?work rdfs:label ?workTitle . FILTER(LANG(?workTitle) = "en") }
          OPTIONAL {
            ?deriv ?rPred ?rVal .
            VALUES ?rPred { pr:P478 pr:P1810 pr:P7421 pr:P304 pq:P3903 }
          }
          OPTIONAL { ?work p:P724 ?iaStat . }
          OPTIONAL { ?iaStat ps:P724 ?inetarchive . }
          OPTIONAL { ?iaStat pq:P8330 ?offset . }
        }
        GROUP BY ?order ?description ?groupKey ?baseValueLabel ?baseValueUrl ?refMode ?work ?workTitle ?baseLangId ?inetarchive ?offset
      }

      BIND(CONCAT(
        COALESCE(CONCAT(?valuenum, " "), ""),
        COALESCE(CONCAT("v. ", ?refvol, " "), ""),
        COALESCE(CONCAT("p. ", ?refpage), ""),
        COALESCE(CONCAT(" c. ", ?refcol), ""),
        COALESCE(CONCAT(" l. ", ?refline), "")
      ) AS ?refnumber)
      BIND(IF(BOUND(?offset), COALESCE(xsd:integer(?refpage) + xsd:integer(?offset), ?refpage), ?refpage) AS ?realpage)
      BIND(CONCAT("https://archive.org/details/", ?inetarchive, COALESCE(CONCAT("/page/n", STR(?realpage), "/mode/1up?view=theater"), "")) AS ?iaUrl)

      BIND(IF(BOUND(?work), COALESCE(CONCAT(?workTitle, " [", ?refnumber, "]"), "Ref."), 1/0) AS ?rowSource)
      BIND(
        IF(BOUND(?work),
          IF(?refMode = "usage",
            CONCAT("../reference?q=", SUBSTR(STR(?work), 32)),
            CONCAT("../reflistlang?l=", COALESCE(?baseLangId, ""), "&qLabel=", COALESCE(STR(?workTitle), ""), "&highlight=", STR(?refnumber), "&displaylang=en&q=", SUBSTR(STR(?work), 32))
          ),
          1/0
        ) AS ?rowSourceUrl
      )
      BIND(IF(?refMode = "ref" && BOUND(?work), COALESCE(?iaUrl, "#"), 1/0) AS ?rowSourceLink)
    }
    GROUP BY ?order ?description ?groupKey
  }
}
ORDER BY ?order
`

idSparql= `
# List of ids for a specific character
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT DISTINCT
  ?idprop ?idpropLabel (CONCAT(?formaturl,?id) AS ?idUrl) ?id
WHERE {
  VALUES ?lexeme { wd:${ l } }
  ?lexeme ?idprop ?id .
  ?idpropp wikibase:directClaim ?idprop ; wikibase:propertyType wikibase:ExternalId .
  OPTIONAL {
    ?idpropp wdt:P1630 ?formatur .
    BIND(REPLACE(STR(?formatur), "\\\\$1", "", "i") AS ?formaturl)
  }
  ?idpropp rdfs:label ?idpropLabel .
  FILTER(lang(?idpropLabel)="en")
}
`


 formsSparql = `
 # List of forms for a specific lexeme
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX dct: <http://purl.org/dc/terms/>
 SELECT
  ?form (GROUP_CONCAT(DISTINCT ?formlabel; separator=" // ") AS ?formLabel)
   (GROUP_CONCAT(DISTINCT ?formlabellang; separator=" // ") AS ?language)
   (GROUP_CONCAT(DISTINCT ?feature; separator=" // ") AS ?features)
   (GROUP_CONCAT(DISTINCT ?featureLabel; separator=" // ") AS ?featuresLabel)   
# (GROUP_CONCAT(DISTINCT ?hyphenation; separator=" // ") AS ?hyphenations)
 WHERE {
   wd:${ l } ontolex:lexicalForm ?form .
   ?form ontolex:representation ?formlabel .
   BIND(lang(?formlabel) AS ?formlabellang)
   OPTIONAL {
     ?form wikibase:grammaticalFeature ?feature .
     ?feature rdfs:label ?featureLabel .
     FILTER (LANG(?featureLabel) = "en")
   }
   OPTIONAL {
    ?form wdt:P5279 ?hyphenation
   }
 }
 GROUP BY ?form
 ORDER BY (STR(?form))
 `

 sensesSparql = `
# List of senses for a specific lexeme
PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
 SELECT
  ?sense ?senseLabel ?glossUrl
  (GROUP_CONCAT(DISTINCT ?glloss; separator=" // ") AS ?gloss)
  (IRI(CONCAT("https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file&width=200&wpvalue=", 
          SUBSTR(STR(SAMPLE(?images)), 52))) AS ?sense_image)
 WHERE {
   wd:${ l } ontolex:sense ?sense .
   BIND(SUBSTR(STR(?sense), 32) AS ?senseLabel)
   ?sense skos:definition ?glosss .
   OPTIONAL {
     ?sense wdt:P5137|wdt:P9970 ?glossUrl .
   }
   OPTIONAL {
   {
     ?sense wdt:P18 ?images
   }UNION {
	?sense wdt:P5137|wdt:P9970 ?glossUrl .
	?glossUrl wdt:P18 ?images .
   }
   }
   BIND(CONCAT(?glosss,"@",lang(?glosss)) AS ?glloss)
 }
 GROUP BY ?sense ?senseLabel ?glossUrl
 ORDER BY (STR(?sense))
`

translationSparql=`
PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX dct: <http://purl.org/dc/terms/>
SELECT DISTINCT (GROUP_CONCAT(DISTINCT ?lexemea; separator=" // ") as ?lexemeLabel) 
    ?lexcat ?lexcatLabel
	(GROUP_CONCAT(DISTINCT ?senseval; separator=" // ") as ?sense)
	(GROUP_CONCAT(DISTINCT ?senselabel; separator=" // ") as ?senseLabel)    
    ?translation ?translationLabel ?language ?languageLabel ?translationlexeme 
    (GROUP_CONCAT(DISTINCT ?lexeme2a; separator=" // ") as ?translationlexemeLabel) 
	WHERE {	
	  wd:${ l } rdf:type ontolex:LexicalEntry ;           
		 dct:language ?lexlang ;		   
		 wikibase:lemma ?lexemea ;
		 wikibase:lexicalCategory ?lexcat .
	  ?lexcat rdfs:label ?lexcatLabel . FILTER(LANG(?lexcatLabel)= "en")
      wd:${ l } ontolex:sense ?sensse .
      {
        wd:${ l } wdt:P11577 ?translationlexeme . ?translationlexeme ontolex:sense ?translation .
      }UNION
      {
        ?sensse wdt:P5972 ?translation . 
        ?translationlexeme ontolex:sense ?translation .
      }
	  ?translation skos:definition ?translationLabel .  FILTER(LANG(?translationLabel)= "en") 
      ?sensse skos:definition ?gloss .  FILTER(LANG(?gloss)= "en") 
      OPTIONAL {?sensse wdt:P5137|wdt:P9970 ?senseval . ?senseval rdfs:label ?senselab .  FILTER(LANG(?senselab)= "en")}
      BIND(CONCAT(?gloss, COALESCE(CONCAT(" [", ?senselab, " (", STRAFTER(STR(?senseval), "http://www.wikidata.org/entity/"), ")", "]"),"")) AS ?senselabel)   
      ?translationlexeme wikibase:lemma ?lexeme2a .
      ?translationlexeme dct:language ?language .	  
      OPTIONAL{?translationlexeme wdt:P7481 ?dialect . ?dialect rdfs:label ?dialectLabel . FILTER(LANG(?dialectLabel)= "en") }
      ?language rdfs:label ?languageeLabel .
      FILTER(LANG(?languageeLabel)= "en")
      BIND(CONCAT(?languageeLabel,COALESCE(CONCAT(" <",?dialectLabel,">"),"")) AS ?languageLabel)
      }
    GROUP BY ?lexeme ?lexcat ?lexcatLabel ?translation ?translationLabel ?language ?languageLabel ?translationlexeme
	ORDER BY ?lexemeLabel
`

compoundsSparql = `
PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
PREFIX wikibase: <http://wikiba.se/ontology#>
PREFIX wd: <http://www.wikidata.org/entity/>
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX dct: <http://purl.org/dc/terms/>
PREFIX p: <http://www.wikidata.org/prop/>
PREFIX ps: <http://www.wikidata.org/prop/statement/>
PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
SELECT
  ?lexeme (GROUP_CONCAT(?lexemelabel; separator=" // ") AS ?lexemeLabel) 
  ?lexical_category ?lexical_categoryLabel ?compounds ?compoundsLabel
  (GROUP_CONCAT(DISTINCT ?sensse; SEPARATOR = " // ") AS ?senses) 
(GROUP_CONCAT(DISTINCT ?senseLabell; SEPARATOR = " // ") AS ?sensesLabel)
WHERE {
  {
    SELECT
      ?lexeme
      (GROUP_CONCAT(?compound; separator=" // ") AS ?compounds)
      (GROUP_CONCAT(DISTINCT ?compoundLabel; separator=" // ") AS ?compoundsLabel)
    WHERE {
	  SELECT ?lexeme ?compound ?compoundLabel ?sensedef WHERE {
      ?lexeme wdt:P5238 wd:${ l } .
      OPTIONAL {
        ?lexeme p:P5238 ?compoundstat .
        ?compoundstat ps:P5238 ?compound .
        ?compound wikibase:lemma ?compoundlabel .
        #FILTER (?compound != wd:L703986)
		?compoundstat pq:P1545 ?seriesordinal .
        OPTIONAL {
          ?compoundstat pq:P5980 ?sense .
          ?sense skos:definition ?sensedeff .
		  FILTER(LANG(?sensedeff) = "en")		  
        }   
        BIND(COALESCE(CONCAT(" [",?sensedeff,"]"), "") AS ?sensedef)
        BIND(CONCAT(?compoundlabel,?sensedef) AS ?compoundLabel)
      }
	}
    ORDER BY xsd:integer(?seriesordinal)
    }
    GROUP BY ?lexeme ?sensedefs
  }UNION{
    SELECT ?lexeme (GROUP_CONCAT(?lexeme; separator=" // ") AS ?compounds)
      (GROUP_CONCAT(DISTINCT ?compoundLabel; separator=" // ") AS ?compoundsLabel) WHERE {
      ?lexeme wdt:P5191 wd:${ l } .
      ?lexeme wikibase:lemma ?compoundlabel .
      OPTIONAL {
          ?lexeme ontolex:sense ?sense .
          ?sense skos:definition ?sensedeff .
		  FILTER(LANG(?sensedeff) = "en")		  
      }  
      BIND(COALESCE(CONCAT(" [",?sensedeff,"]"), "") AS ?sensedef)
      BIND(CONCAT(?compoundlabel,?sensedef) AS ?compoundLabel)
    }GROUP BY ?lexeme
  }
  
  ?lexeme wikibase:lemma ?lexemelabel .
  OPTIONAL {
	  ?lexeme wikibase:lexicalCategory ?lexical_category .
	  ?lexical_category rdfs:label ?lexical_categoryLabel .
	  FILTER (LANG(?lexical_categoryLabel) = 'en')
  }
  OPTIONAL {
    ?lexeme ontolex:sense ?senseitem.
    ?senseitem skos:definition ?gloss.
    OPTIONAL {
      ?senseitem wdt:P5137|wdt:P9970 ?sensee.
      ?sensee rdfs:label ?senseLab.
      FILTER(LANG(?senseLab) = "en")
    }
    FILTER(LANG(?gloss) = "en")
    BIND(COALESCE(?sensee, "") AS ?sensse)
    BIND(CONCAT(?gloss, COALESCE(CONCAT(" [", ?senseLab, " (", STRAFTER(STR(?sensee), "http://www.wikidata.org/entity/"), ")", "]"),"")) AS ?senseLabell)
  }
}
GROUP BY ?lexeme ?lexical_category ?lexical_categoryLabel ?compounds ?compoundsLabel
